[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drawio-agent-rollout"
version = "0.1.0"
description = "Editable draw.io compilation, blind agent rollouts and teacher trajectory export"
requires-python = ">=3.11"

[project.optional-dependencies]
data = ["zstandard==0.25.0"]
publish = ["huggingface-hub==0.35.3", "requests>=2.31"]
compare = ["Pillow==11.3.0", "playwright==1.58.0", "lxml", "numpy", "scipy", "networkx"]

[project.scripts]
drawio-compile = "drawio.compiler.cli:main"
drawio-compare = "drawio.compare.cli:main"
drawio-check = "drawio.mcp.__main__:main"

[tool.setuptools.packages.find]
include = ["drawio*"]

[tool.setuptools.package-data]
"drawio.compiler" = ["*.js"]
"drawio.compare" = ["*.xsd", "LICENSE.*"]
"drawio.runtime" = ["*.js"]

[tool.ruff]
line-length = 110
